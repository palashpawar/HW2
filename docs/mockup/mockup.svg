<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#f3f4f6"/>
  <rect x="16" y="16" width="928" height="588" rx="10" fill="#ffffff" stroke="#d1d5db"/>

  <!-- title bar -->
  <rect x="16" y="16" width="928" height="58" rx="10" fill="#1d4ed8"/>
  <rect x="16" y="60" width="928" height="14" fill="#1d4ed8"/>
  <text x="40" y="42" fill="#ffffff" font-size="17" font-weight="700">PCA Image Compressor</text>
  <text x="40" y="60" fill="#c7d2fe" font-size="11.5">Rebuild any image from its first k principal components</text>
  <text x="838" y="49" fill="#c7d2fe" font-size="11.5">? &#160;How it works</text>

  <!-- ================= sidebar ================= -->
  <rect x="32" y="90" width="252" height="498" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>

  <!-- step 1: upload -->
  <circle cx="52" cy="118" r="9" fill="#1d4ed8"/><text x="52" y="122" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="70" y="122" font-size="13" font-weight="700" fill="#111827">Upload an image</text>
  <rect x="48" y="134" width="220" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="5 4"/>
  <path d="M158 152 l0 26 M148 162 l10 -10 10 10" stroke="#1d4ed8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="158" y="192" font-size="11.5" fill="#1e3a8a" text-anchor="middle">Drop a file or click to browse</text>
  <text x="158" y="219" font-size="10.5" fill="#6b7280" text-anchor="middle">.jpg &#183; .png &#183; .csv matrix &#160;(max 10 MB)</text>
  <rect x="48" y="228" width="220" height="26" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="58" y="245" font-size="11" fill="#374151">puppy.jpg &#160;&#183;&#160; 376 &#215; 345</text>
  <text x="256" y="245" font-size="11" fill="#9ca3af" text-anchor="end">&#10005;</text>

  <!-- step 2: k -->
  <circle cx="52" cy="288" r="9" fill="#1d4ed8"/><text x="52" y="292" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="70" y="292" font-size="13" font-weight="700" fill="#111827">Choose the rank k</text>
  <text x="48" y="315" font-size="11" fill="#6b7280">more compression</text>
  <text x="268" y="315" font-size="11" fill="#6b7280" text-anchor="end">more detail</text>
  <line x1="56" y1="332" x2="260" y2="332" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="332" x2="128" y2="332" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="332" r="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="56" y="352" font-size="10" fill="#9ca3af">1</text>
  <text x="260" y="352" font-size="10" fill="#9ca3af" text-anchor="end">345</text>
  <rect x="104" y="356" width="48" height="22" rx="5" fill="#1d4ed8"/>
  <text x="128" y="371" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">k = 24</text>
  <text x="48" y="398" font-size="11" fill="#6b7280">presets</text>
  <rect x="48" y="404" width="66" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="81" y="420" font-size="11" fill="#374151" text-anchor="middle">tiny</text>
  <rect x="120" y="404" width="70" height="24" rx="12" fill="#e0e7ff" stroke="#1d4ed8"/>
  <text x="155" y="420" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">balanced</text>
  <rect x="196" y="404" width="72" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="232" y="420" font-size="11" fill="#374151" text-anchor="middle">near-exact</text>

  <!-- stats -->
  <line x1="48" y1="448" x2="268" y2="448" stroke="#e5e7eb"/>
  <text x="48" y="470" font-size="11.5" fill="#6b7280">relative error</text>
  <text x="268" y="470" font-size="11.5" font-weight="700" fill="#111827" text-anchor="end">12.4%</text>
  <text x="48" y="492" font-size="11.5" fill="#6b7280">variance kept</text>
  <text x="268" y="492" font-size="11.5" font-weight="700" fill="#111827" text-anchor="end">98.5%</text>
  <text x="48" y="514" font-size="11.5" fill="#6b7280">numbers stored</text>
  <text x="268" y="514" font-size="11.5" font-weight="700" fill="#111827" text-anchor="end">17,304</text>
  <text x="48" y="536" font-size="11.5" fill="#6b7280">size vs original</text>
  <text x="268" y="536" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="end">13.3%</text>
  <rect x="48" y="552" width="220" height="30" rx="6" fill="#111827"/>
  <text x="158" y="572" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Download compressed image</text>

  <!-- ================= main panels ================= -->
  <text x="308" y="106" font-size="13" font-weight="700" fill="#111827">Original</text>
  <text x="404" y="106" font-size="11" fill="#9ca3af">376 &#215; 345 &#183; 129,720 numbers</text>
  <rect x="308" y="116" width="300" height="290" rx="6" fill="#e5e7eb" stroke="#d1d5db"/>
  <g transform="translate(308,116)">
    <rect x="0" y="0" width="300" height="290" rx="6" fill="#9ca3af"/>
    <ellipse cx="150" cy="150" rx="96" ry="66" fill="#374151"/>
    <ellipse cx="196" cy="128" rx="44" ry="42" fill="#1f2937"/>
    <circle cx="214" cy="122" r="9" fill="#f9fafb"/><circle cx="214" cy="122" r="4" fill="#111827"/>
    <ellipse cx="96" cy="176" rx="34" ry="15" fill="#f3f4f6"/>
    <rect x="0" y="224" width="300" height="66" fill="#b9bfc7"/>
  </g>
  <text x="628" y="106" font-size="13" font-weight="700" fill="#1d4ed8">Compressed &#183; k = 24</text>
  <text x="806" y="106" font-size="11" fill="#9ca3af">17,304 numbers</text>
  <rect x="628" y="116" width="300" height="290" rx="6" fill="#e5e7eb" stroke="#1d4ed8"/>
  <g transform="translate(628,116)">
    <rect x="0" y="0" width="300" height="290" rx="6" fill="#9ca3af"/>
    <ellipse cx="150" cy="150" rx="98" ry="68" fill="#3f4854" opacity="0.92"/>
    <ellipse cx="196" cy="128" rx="46" ry="44" fill="#2a323d" opacity="0.92"/>
    <circle cx="214" cy="122" r="10" fill="#e5e7eb" opacity="0.8"/>
    <ellipse cx="96" cy="176" rx="36" ry="17" fill="#e5e7eb" opacity="0.75"/>
    <rect x="0" y="224" width="300" height="66" fill="#b9bfc7"/>
    <g opacity="0.28" stroke="#ffffff">
      <line x1="40" y1="0" x2="40" y2="290"/><line x1="92" y1="0" x2="92" y2="290"/>
      <line x1="150" y1="0" x2="150" y2="290"/><line x1="208" y1="0" x2="208" y2="290"/>
      <line x1="260" y1="0" x2="260" y2="290"/>
    </g>
  </g>
  <!-- slider under the pair -->
  <line x1="404" y1="428" x2="832" y2="428" stroke="#d1d5db" stroke-width="5" stroke-linecap="round"/>
  <line x1="404" y1="428" x2="534" y2="428" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="534" cy="428" r="11" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="308" y="432" font-size="11.5" fill="#374151">rank k</text>
  <text x="856" y="432" font-size="11.5" fill="#6b7280">drag to compare</text>

  <!-- error curve -->
  <text x="308" y="472" font-size="13" font-weight="700" fill="#111827">Error against k</text>
  <text x="440" y="472" font-size="11" fill="#9ca3af">where you are on the curve</text>
  <rect x="308" y="482" width="620" height="100" rx="6" fill="#ffffff" stroke="#e5e7eb"/>
  <polyline points="324,494 340,520 356,538 376,550 400,558 436,564 480,568 540,571 620,573 720,574 830,575 912,576"
            fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="400" y1="486" x2="400" y2="578" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <circle cx="400" cy="558" r="4.5" fill="#dc2626"/>
  <text x="408" y="502" font-size="10.5" fill="#374151">k = 24</text>
  <text x="900" y="500" font-size="10" fill="#9ca3af" text-anchor="end">error</text>
</svg>
